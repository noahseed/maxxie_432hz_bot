name: Tests Python
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-covers.txt
      - run: python -m unittest discover -s tests -v

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: maxxie_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-database.txt -r requirements-covers.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: python -m unittest discover -s tests -p test_postgres.py -v
        env:
          TEST_DATABASE_URL: postgresql://postgres:integration-only@localhost:5432/maxxie_bot_test
